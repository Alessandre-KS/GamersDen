<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Reloaded - Gamers Den</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="light-theme">
    <div class="theme-toggle">
        <i class="fas fa-moon"></i>
    </div>
    
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar__container">
            <a href="../../index.html" id="navbar__logo">GAMERS DEN</a>
            <ul class="navbar__menu">
                <li class="navbar__item">
                    <a href="../../index.html" class="navbar__links">HOME</a>
                </li>
                <li class="navbar__item">
                    <a href="../../about.html" class="navbar__links">ABOUT US</a>
                </li>
                <!-- NEW: Leaderboards Link -->
                <li class="navbar__item">
                    <a href="build/web/leaderboards.html" class="navbar__links">LEADERBOARDS</a>
                </li>
                <li class="navbar__item">
                    <a href="../../profile.html" class="navbar__links">PROFILE</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Game Content -->
    <div class="game-page active">
        <a href="../../index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Games
        </a>
        
        <div class="game-header">
            <h1>INSCRIPTION RELOADED</h1>
            <p>Defeat the enemy for every wave be the longest survivor to be the Top of the Leaderboard</p>
        </div>
        <div class="game-container">
            <div class="game-instructions">
                <p><strong>How to Play:</strong> WASD to move, Left Click to Shoot, Q to Change Gun</p>
            </div>
            
            <!-- Game iframe -->
            <div class="game-iframe-container">
                <iframe src="./build/web/index.html" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="../../JS/firebase-auth.js"></script>
    <script src="../../JS/main.js"></script>
    <script type="module" src="../../JS/gameTracker.js"></script>
    <script src="../../JS/websocket-client.js"></script>
    
</body>
</html>
