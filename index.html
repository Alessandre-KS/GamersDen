<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamers Den - Pixel Anime Game Hub</title>
    
    <!-- External CSS for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Pixel-style Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&display=swap" rel="stylesheet">
    
    <!-- Main Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <!-- Theme Toggle Button -->
    <div class="theme-toggle">
        <i class="fas fa-moon"></i>
    </div>
    
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar__container">
            <a href="index.html" id="navbar__logo">GAMERS DEN</a>
            <ul class="navbar__menu">
                <li class="navbar__item">
                    <a href="index.html" class="navbar__links">HOME</a>
                </li>
                <li class="navbar__item">
                    <a href="about.html" class="navbar__links">ABOUT US</a>
                </li>
                <!-- NEW: Leaderboards Link -->
                <li class="navbar__item">
                    <a href="./gamePages/inscriptionReloaded/build/web/leaderboards.html" class="navbar__links">LEADERBOARDS</a>
                </li>
                <li class="navbar__item" id="userProfileNav">
                    <!-- Will be populated by JavaScript -->
                </li>
            </ul>
        </div>
    </nav>

    <!-- Home Content (Main Page) -->
    <div id="home-content">
        <!-- Banner Carousel Section -->
        <section class="banner-section" id="home">
            <div class="banner-carousel" id="bannerCarousel">
                <!-- Banner slides will be generated by JavaScript -->
            </div>
        </section>

        <!-- Games Grid Section -->
        <section class="features" id="games">
            <h1>GAMES COLLECTION</h1>
            
            <!-- Search Box -->
            <div class="search-container">
                <div class="search-box pixel-panel">
                    <i class="fas fa-search search-icon"></i>
                    <input 
                        type="text" 
                        id="gameSearch" 
                        class="search-input pixel-input" 
                        placeholder="Search games by name, category, or description..."
                        aria-label="Search games"
                    >
                    <button id="clearSearch" class="clear-search-btn" aria-label="Clear search">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <!-- NEW: Filter Chips -->
                <div class="filter-chips-container">
                    <div class="filter-chips-header">
                        <span class="filter-label">Filter by Category:</span>
                        <button id="clearFilters" class="clear-filters-btn" aria-label="Clear all filters">
                            Clear All
                        </button>
                    </div>
                    <div class="filter-chips" id="filterChips">
                        <!-- Filter chips will be generated by JavaScript -->
                    </div>
                </div>
                
                <div class="search-results-info" id="searchResultsInfo">
                    Showing all games
                </div>
            </div>

            <div class="features__wrapper" id="gamesGrid">
                <!-- Game cards will be generated by JavaScript -->
                <div class="features__card" style="text-align: center; padding: 2rem;">
                    <p>Loading games...</p>
                </div>
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="./JS/main.js"></script>
    <script type="module" src="./JS/firebase-auth.js"></script>
    <script type="module" src="./JS/auth-combined.js"></script>
    
</body>
</html>
